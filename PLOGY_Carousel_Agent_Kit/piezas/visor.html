<title>Visor de piezas Plogy</title>
<!-- Visor local de las piezas. No reemplaza ni borra nada: cada pieza conserva sus propios archivos y aquí solo se alterna entre ellos.
     Cómo agregar una pieza nueva: añade un objeto a PIEZAS (más abajo) con su carpeta y sus vistas.
     Hay que abrirlo desde el disco (doble clic). Las láminas y los textos se cargan en marcos (iframes) desde las carpetas de cada pieza.
     La vista "Brief" y las páginas de texto (.html) se generan desde los .md con piezas/_visor/md_to_html.py. -->

<style>
:root{

  --surface:#f4f1ef; --border:#d9d0c7; --stage:#e4ddd5;
  --display:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#f4efe9;--paper:#171310;--muted:#bdb2a8;--surface:#211b17;--border:#3a322c;--stage:#0f0c0a;--orangeText:#ff8a4d}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--body);display:flex;flex-direction:column}
header{flex:none;padding:14px 20px 0;border-bottom:1px solid var(--border);background:var(--paper)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{font:700 20px/1 var(--display);letter-spacing:-.02em}
.top small{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.tabs button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:999px}
.tabs button b{font-family:var(--display);margin-right:6px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row2{padding:10px 0 12px}
.row2 .tabs{margin:0}
.row2 .tabs button{padding:6px 12px;font-size:14px}
.row2 .tabs button[aria-selected="true"]{background:var(--orange);border-color:var(--orange);color:#171310}
.row3{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 12px;color:var(--muted);font-size:14px}
.row3 a{color:var(--orangeText)}
main{flex:1;min-height:0;background:var(--stage);overflow:auto;position:relative}
iframe{border:0;display:block;background:var(--paper)}
.full iframe{width:100%;height:100%}
.single{padding:16px;display:flex;justify-content:center}
.single .frame{box-shadow:0 10px 40px rgba(0,0,0,.25);transform-origin:top left}
.note{padding:10px 20px;color:var(--muted);font-size:14px}
/* Las piezas van en una sola fila con desplazamiento horizontal, para que la cabecera no crezca con cada pieza nueva. */
#pieces{position:relative;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
#pieces button{flex:none;white-space:nowrap;padding:7px 12px;font-size:14px;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.row3{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
#lotes button{padding:8px 16px}
#lotes button b{font-size:15px}
#lotes button[aria-selected="true"]{background:var(--orange);border-color:var(--orange);color:#171310}
#pieces{margin-top:8px}
.row3 > *{flex:none;white-space:nowrap}
</style>
</head>

/* Lotes: agrupan las piezas en la cabecera. Una pieza sin "lote" va en "anteriores". */
var LOTES = [
  { id:"semana", title:"Semana 26 oct a 1 nov", sub:"15 piezas" },
  { id:"anteriores", title:"Piezas 001 a 026", sub:"y biblioteca de CTA" }
];
function loteDe(x){ return x.lote || "anteriores"; }
var state = { p:0, v:0, k:"all" };
var $lotes = document.getElementById("lotes"), $pieces = document.getElementById("pieces"), $views = document.getElementById("views"),
    $nav = document.getElementById("nav"), $stage = document.getElementById("stage");

function parseHash(){
  var m = location.hash.replace("#","").split("/");
  var p = PIEZAS.findIndex(function(x){return x.id===m[0];});
  if (p>=0){ state.p=p; var v = parseInt(m[1],10); state.v = (v>=0 && v<PIEZAS[p].views.length) ? v : 0; state.k = m[2]||"all"; }
}
function setHash(){ location.hash = PIEZAS[state.p].id + "/" + state.v + (state.k!=="all" ? "/"+state.k : ""); }

function btn(label, selected, fn){
  var b = document.createElement("button"); b.setAttribute("role","tab"); b.setAttribute("aria-selected", selected?"true":"false");
  b.innerHTML = label; b.onclick = fn; return b;
}

function render(){
  var P = PIEZAS[state.p], V = P.views[state.v];
  $lotes.innerHTML = ""; $pieces.innerHTML = ""; $views.innerHTML = ""; $nav.innerHTML = ""; $stage.innerHTML = "";
  var L = loteDe(P);
  LOTES.forEach(function(l){
    $lotes.appendChild(btn("<b>"+l.title+"</b>"+l.sub, l.id===L, function(){
      state.p = PIEZAS.findIndex(function(x){return loteDe(x)===l.id;}); state.v=0; state.k="all"; setHash(); render(); }));
  });
  PIEZAS.forEach(function(x,i){
    if (loteDe(x)!==L) return;
    $pieces.appendChild(btn("<b>"+x.id+"</b>"+x.title, i===state.p, function(){ state.p=i; state.v=0; state.k="all"; setHash(); render(); }));
  });
  var sel = $pieces.querySelector('[aria-selected="true"]');
  if (sel) $pieces.scrollLeft = sel.offsetLeft - ($pieces.clientWidth - sel.offsetWidth) / 2;
  P.views.forEach(function(x,i){
    $views.appendChild(btn(x.label, i===state.v, function(){ state.v=i; state.k="all"; setHash(); render(); }));
  });

  var base = P.dir + "/" + V.file;
  if (V.kind==="slides"){
    var all = btn("Todas", state.k==="all", function(){ state.k="all"; setHash(); render(); });
    $nav.appendChild(document.createTextNode("Ver: ")); $nav.appendChild(all);
    V.keys.forEach(function(k){
      var label = (V.param==="v") ? k.toUpperCase() : k;
      $nav.appendChild(btn(label, state.k===k, function(){ state.k=k; setHash(); render(); }));
    });
    $nav.querySelectorAll("button").forEach(function(b){ b.style.cssText="font:inherit;cursor:pointer;border:1px solid var(--border);background:"+(b.getAttribute("aria-selected")==="true"?"var(--ink)":"var(--surface)")+";color:"+(b.getAttribute("aria-selected")==="true"?"var(--paper)":"var(--ink)")+";padding:5px 12px;border-radius:999px"; });
    if (V.note){ var n=document.createElement("span"); n.textContent=V.note; $nav.appendChild(n); }
    if (state.k==="all"){
      $stage.className="full";
      var f=document.createElement("iframe"); f.src=base; f.title=P.title+" · "+V.label; $stage.appendChild(f);
    } else {
      $stage.className="single";
      var wrap=document.createElement("div"); wrap.className="frame";
      var f2=document.createElement("iframe"); f2.src=base+"?"+V.param+"="+state.k; f2.width=1080; f2.height=1350; f2.title=P.title+" · "+V.label+" "+state.k;
      wrap.appendChild(f2); $stage.appendChild(wrap); fit(wrap);
      var a=document.createElement("a"); a.href=P.dir+"/"+V.png(state.k); a.target="_blank"; a.textContent="Abrir el PNG exportado"; $nav.appendChild(a);
    }
  } else {
    $stage.className="full";
    var f3=document.createElement("iframe"); f3.src=base; f3.title=P.title+" · "+V.label; $stage.appendChild(f3);
    var a2=document.createElement("a"); a2.href=base; a2.target="_blank"; a2.textContent="Abrir en una pestaña"; $nav.appendChild(a2);
  }
}

function fit(wrap){
  var availW = $stage.clientWidth - 32, availH = $stage.clientHeight - 32;
  var s = Math.min(1, availW/1080, availH/1350);
  wrap.style.width = (1080*s)+"px"; wrap.style.height = (1350*s)+"px";
  var f = wrap.querySelector("iframe"); f.style.transform = "scale("+s+")"; f.style.transformOrigin = "top left";
}
window.addEventListener("resize", function(){ var w=document.querySelector(".frame"); if(w) fit(w); });
window.addEventListener("hashchange", function(){ parseHash(); render(); });
/* La rueda del mouse mueve la fila de piezas de lado. */
document.getElementById("pieces").addEventListener("wheel", function(e){
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { this.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive:false});
document.addEventListener("keydown", function(e){
  var V = PIEZAS[state.p].views[state.v];
  if (V.kind!=="slides" || state.k==="all") return;
  var i = V.keys.indexOf(state.k);
  if (e.key==="ArrowRight" && i<V.keys.length-1){ state.k=V.keys[i+1]; setHash(); render(); }
  if (e.key==="ArrowLeft" && i>0){ state.k=V.keys[i-1]; setHash(); render(); }
});

if (!location.hash) state.p = PIEZAS.findIndex(function(x){return loteDe(x)==="semana";});
parseHash(); render();
</script>
