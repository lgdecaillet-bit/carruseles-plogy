<!doctype html>

<meta charset="utf-8">
<title>Pieza 026 · Motion con Claude</title>
<!-- Fuente editable. 19 láminas animadas de 1080x1350 (ciclos de 6 s). Adaptación de una referencia de otra cuenta (16 efectos de movimiento hechos con Claude).
     Vista previa en vivo: abrir sin parámetros (todas) o con ?s=N (una sola).
     Exportar a MP4: python -I scripts/capturar.py (Playwright con Edge + ffmpeg). Cada escena se dibuja en función del tiempo t, así la captura es exacta.
     Todo se dibuja con canvas 2D y Space Grotesk. Paleta: tokens de Plogy y el degradado del logo (naranja, coral, rosa, rosado, malva, violeta).
     Las cifras de negocio (ventas, facturación, factura, pagos) son ejemplos rotulados "Ilustración".
     CTA: tarjeta de vidrio sobre la foto 06 de la biblioteca, según la preferencia de CTA de Plogy. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171310; --paper:#ffffff; --muted:#625951; --orange:#ff5b00; --orangeText:#b43d00;
  --surface:#f4f1ef; --line:#e6ddd5;
  --display:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9d2cb;font-family:var(--body)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;padding:96px;color:var(--ink);
  background:linear-gradient(rgba(23,19,16,.045) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,rgba(23,19,16,.045) 1px,transparent 1px) 0 0/36px 36px,#fbf9f7}
body:not(.single){display:flex;flex-wrap:wrap;gap:32px;padding:32px}
body:not(.single) .slide{zoom:.4}
body.single{background:none;padding:0}
body.single .slide:not(.on){display:none}
.logo{position:absolute;top:80px;left:58px;width:220px;height:auto;z-index:6}
.count{position:absolute;top:92px;right:96px;z-index:6;font:700 26px/1 var(--display);letter-spacing:.04em;color:var(--muted)}
.hl{color:var(--orange)}
.ilus{position:absolute;right:16px;top:16px;z-index:3;font:700 15px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.85);color:var(--muted)}
.stage.dk .ilus{background:rgba(23,19,16,.6);color:#cfc6bd}

/* lámina de escena */
.sc .ey{position:absolute;left:96px;top:196px;font:700 22px/1 var(--mono);letter-spacing:.14em;color:var(--muted)}
.sc .ey b{color:var(--orange)}
.sc h2{position:absolute;left:96px;right:96px;top:232px;font:700 96px/1 var(--display);letter-spacing:-.045em}
.sc h2 i{font-style:normal;color:#b9aea5;margin:0 6px;font-weight:500}
.sc .sub{position:absolute;left:96px;top:344px;font:400 32px/1.2 var(--body);color:var(--muted)}
.stage{position:absolute;left:96px;top:412px;width:888px;height:600px;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px #fff,0 30px 70px rgba(23,19,16,.14)}
.stage canvas{display:block;width:888px;height:600px}
.swap{position:absolute;left:96px;right:96px;top:1050px;border-radius:24px;background:#fff;border:2px solid var(--line);padding:22px 26px}
.swap small{display:block;font:700 18px/1 var(--mono);letter-spacing:.16em;color:var(--orange)}

/* portada */
.p1 h1{position:absolute;left:96px;right:60px;top:180px;font:700 70px/1 var(--display);letter-spacing:-.045em;white-space:nowrap}
.p1 .word{display:inline-block;color:var(--orange)}
.p1 .sub{position:absolute;left:96px;right:96px;top:276px;font:400 30px/1.3 var(--body);color:var(--muted)}
.grid{position:absolute;left:96px;right:96px;top:350px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mini{border-radius:16px;background:#fff;box-shadow:0 0 0 1.5px var(--line),0 10px 24px rgba(23,19,16,.07);padding:8px 8px 10px}

.p1 .foot b{color:var(--orange)}

/* criterio */
.p18{background:var(--orange)!important}
.p18 .count{color:var(--ink)}

.p18 h2{position:absolute;left:96px;right:96px;top:246px;font:700 96px/1.02 var(--display);letter-spacing:-.04em}
.p18 h2 span{color:#fff}
.p18 .lead{position:absolute;left:96px;right:96px;top:610px;font:500 36px/1.3 var(--display);letter-spacing:-.01em}
.p18 .stage{top:790px;left:216px;width:648px;height:438px;box-shadow:0 0 0 8px #fff,0 30px 60px rgba(23,19,16,.3)}
.p18 .stage canvas{width:648px;height:438px}

/* CTA */
.p19{background:#120d0a!important;color:#fff}
.p19 .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p19 .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,13,10,.25),rgba(18,13,10,.1) 40%,rgba(18,13,10,.7))}
.glass{position:absolute;left:84px;right:84px;top:250px;z-index:4;border-radius:44px;padding:46px 50px 40px;text-align:center;
  background:rgba(30,22,17,.45);border:1.5px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);
  box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.glass .pill{display:inline-block;font:700 20px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:#ffb48a;border:2px solid rgba(255,180,138,.6);border-radius:999px;padding:12px 20px}
.glass small{display:block;margin-top:26px;font:700 52px/1 var(--display)}
.glass strong{display:block;margin-top:6px;font:700 150px/1 var(--display);letter-spacing:-.04em;color:var(--orange);text-shadow:0 0 50px rgba(255,91,0,.5)}
.glass p{margin-top:18px;font:400 30px/1.35 var(--body);color:#e6dfd8}
.glass p b{color:#fff}
.inp{margin:26px auto 0;width:520px;display:flex;align-items:center;gap:14px;border-radius:999px;background:#fff;padding:12px 18px;color:var(--ink);text-align:left}
.inp img{width:46px;height:46px}
.inp span{font:700 32px/1 var(--mono);letter-spacing:.04em;color:var(--orange)}
.inp i{display:inline-block;width:3px;height:32px;background:var(--ink);vertical-align:-5px;margin-left:2px}
.list{margin-top:26px;border-radius:24px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);text-align:left}
.list div{display:flex;align-items:baseline;gap:16px;padding:18px 24px;border-top:1.5px solid rgba(255,255,255,.12);font:400 25px/1.3 var(--body);color:#cfc6bd}
.list div:first-child{border-top:0}
.list i{font:700 20px/1 var(--mono);font-style:normal;color:var(--orange)}
.list b{font:700 28px/1.2 var(--display);color:#fff;white-space:nowrap}
.p19 .made{position:absolute;left:0;right:0;bottom:64px;z-index:4;text-align:center;font:500 22px/1 var(--mono);color:#e6dfd8;letter-spacing:.06em}

/* barra de autor: la pieza sale en Plogy y en la cuenta personal */
.autor{position:absolute;left:96px;bottom:24px;z-index:20;display:flex;align-items:center;gap:12px;border-radius:999px;background:rgba(255,255,255,.94);padding:7px 20px 7px 7px;box-shadow:0 8px 22px rgba(23,19,16,.16),0 0 0 1px rgba(23,19,16,.06)}
.autor img{width:46px;height:46px;border-radius:50%;display:block}
.autor b{font:700 22px/1 'Space Grotesk','Helvetica Neue',Arial,sans-serif;color:#171310;white-space:nowrap}
.autor span{font:500 21px/1 Consolas,'Courier New',monospace;color:#625951;white-space:nowrap}
.autor i{width:5px;height:5px;border-radius:50%;background:#ff5b00;display:block}
.stage{top:396px}
.swap{top:1022px;padding:18px 24px}
.swap p{font-size:21px;margin-top:10px}
.swap .used{font-size:19px;margin-top:10px;padding-top:10px}
.p1 .foot{left:auto;bottom:40px}
.p1 .foot span:first-child{display:none}
.p19 .made{display:none}
</style>

<body>

<div id="deck"></div>

<script>
/* ---------- utilidades ---------- */
const TAU=Math.PI*2, DUR=6, W0=888, H0=600;
const STOPS=['#ff5b00','#f75946','#ee5358','#e1556a','#c85981','#9c5aa7'];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const ST=STOPS.map(hex);
function gc(u,a=1){u=Math.min(1,Math.max(0,u))*(ST.length-1);const i=Math.min(ST.length-2,Math.floor(u)),f=u-i;const c=ST[i].map((v,j)=>Math.round(v+(ST[i+1][j]-v)*f));return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function lin(ctx,x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);STOPS.forEach((s,i)=>g.addColorStop(i/(STOPS.length-1),s));return g}
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=s*16807%2147483647;return(s-1)/2147483646}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let S=1; // escala del canvas actual respecto a 888x600
const F=(w,s)=>`${w} ${s}px "Space Grotesk"`;
const OFF={};function off(k,w,h){if(!OFF[k]){const c=document.createElement('canvas');c.width=w;c.height=h;OFF[k]=c}return OFF[k]}
function darkBg(ctx){ctx.fillStyle='#171310';ctx.fillRect(0,0,W0,H0);const g=ctx.createRadialGradient(444,300,0,444,300,560);g.addColorStop(0,'rgba(255,91,0,.16)');g.addColorStop(1,'rgba(255,91,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W0,H0)}
function lightBg(ctx){const g=ctx.createLinearGradient(0,0,0,H0);g.addColorStop(0,'#fdfbfa');g.addColorStop(1,'#f3ede8');ctx.fillStyle=g;ctx.fillRect(0,0,W0,H0)}
function card(ctx,x,y,w,h,r){ctx.save();ctx.shadowColor='rgba(23,19,16,.12)';ctx.shadowBlur=40*S;ctx.shadowOffsetY=14*S;ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.restore()}
const pesos=n=>'$'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');

/* ---------- 16 escenas: cada una dibuja el cuadro del segundo t ---------- */
let P1=null;
function initP1(){const oc=document.createElement('canvas');oc.width=W0;oc.height=H0;const o=oc.getContext('2d');o.font=F(700,250);o.textAlign='center';o.textBaseline='middle';o.fillText('Plogy',444,300);const d=o.getImageData(0,0,W0,H0).data;const pts=[];for(let y=0;y<H0;y+=8)for(let x=(y/8%2)*4;x<W0;x+=8){if(d[(y*W0+x)*4+3]>128)pts.push([x,y])}const r=rnd(7);P1=pts.map(p=>{const a=r()*TAU,R=560+r()*220;return{tx:p[0],ty:p[1],sx:444+Math.cos(a)*R,sy:300+Math.sin(a)*R*.8,ra:Math.atan2(p[1]-300,p[0]-444)+(r()-.5)*.6,rr:250+r()*90,d:r()*.6,ph:r()*TAU,s:2.6+r()*1.6}})}
function s1(ctx,t){darkBg(ctx);if(!P1)initP1();for(const p of P1){let x,y;const rx=444+Math.cos(p.ra)*p.rr*1.25,ry=300+Math.sin(p.ra)*p.rr*.85;
  if(t<3.3){const a=eout(seg(t,.1+p.d,2.0+p.d*.5));x=p.sx+(p.tx-p.sx)*a;y=p.sy+(p.ty-p.sy)*a;const sh=seg(t,2.2,2.6)*(1-seg(t,2.9,3.3));x+=Math.sin(t*9+p.ph)*2*sh;y+=Math.cos(t*8+p.ph)*2*sh}
  else if(t<4.1){const b=eout(seg(t,3.3,4.1));x=p.tx+(rx-p.tx)*b;y=p.ty+(ry-p.ty)*b}
  else{const b=ease(seg(t,4.2,6));x=rx+(p.sx-rx)*b;y=ry+(p.sy-ry)*b}
  const glow=seg(t,2.2,2.5)*(1-seg(t,2.8,3.2));ctx.fillStyle=gc(p.tx/W0,.92);ctx.beginPath();ctx.arc(x,y,p.s+glow*1.4,0,TAU);ctx.fill()}}

function s2(ctx,t){ctx.fillStyle='#fff';ctx.fillRect(0,0,W0,H0);ctx.save();ctx.beginPath();ctx.moveTo(0,230);ctx.lineTo(W0,50);ctx.lineTo(W0,H0);ctx.lineTo(0,H0);ctx.closePath();ctx.clip();ctx.fillStyle='#c85981';ctx.fillRect(0,0,W0,H0);ctx.filter=`blur(${34*S}px)`;const ph=t/DUR*TAU;
  [['#e1556a',120],['#ff5b00',230],['#ffb48a',330],['#f75946',410],['#9c5aa7',500]].forEach(([c,y0],i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-120,800);for(let x=-120;x<=1010;x+=16){ctx.lineTo(x,y0+Math.sin(x/170+ph+i*1.3)*48+Math.sin(x/95-2*ph+i)*20)}ctx.lineTo(1010,800);ctx.closePath();ctx.fill()});
  ctx.filter='none';ctx.restore();ctx.fillStyle='#171310';ctx.font=F(600,42);ctx.fillText('Flujo',64,96)}

function s3(ctx,t){const ph=t/DUR*TAU,oc=off('s3',W0,H0),o=oc.getContext('2d');o.fillStyle='#171310';o.fillRect(0,0,W0,H0);o.filter='blur(60px)';
  [['#ff5b00',620+Math.cos(ph)*130,430+Math.sin(ph)*70,190],['#9c5aa7',260+Math.cos(ph+2)*110,190+Math.sin(ph+1)*80,220],['#e1556a',460+Math.sin(ph)*150,310,150]].forEach(([c,x,y,r])=>{o.fillStyle=c;o.beginPath();o.arc(x,y,r,0,TAU);o.fill()});o.filter='none';ctx.drawImage(oc,0,0);
  const th=Math.sin(ph)*.34,cw=500,ch=310;ctx.save();ctx.translate(444,300);ctx.transform(Math.cos(th),Math.sin(th)*.16,-Math.sin(th)*.05,1,0,0);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=50*S;ctx.shadowOffsetY=24*S;ctx.fillStyle='rgba(255,255,255,.01)';ctx.beginPath();ctx.roundRect(-cw/2,-ch/2,cw,ch,30);ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.roundRect(-cw/2,-ch/2,cw,ch,30);ctx.clip();ctx.filter=`blur(${16*S}px)`;ctx.drawImage(oc,-444,-300);ctx.filter='none';ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(-cw/2,-ch/2,cw,ch);
  const sx=-cw*1.2+(t/DUR)*cw*2.6,g=ctx.createLinearGradient(sx-90,0,sx+90,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.3)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(-cw/2,-ch/2,cw,ch);ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-cw/2,-ch/2,cw,ch,30);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.78)';ctx.font=F(700,20);ctx.fillText('FACTURA #0427',-cw/2+34,-ch/2+56);
  ctx.fillStyle='#ff5b00';ctx.beginPath();ctx.roundRect(cw/2-150,-ch/2+30,118,40,20);ctx.fill();ctx.fillStyle='#171310';ctx.font=F(700,21);ctx.fillText('Pagada',cw/2-130,-ch/2+57);
  ctx.fillStyle='#fff';ctx.font=F(700,64);ctx.fillText('$1.250.000',-cw/2+32,22);
  ctx.fillStyle='rgba(255,255,255,.72)';ctx.font=F(500,22);ctx.fillText('Panadería Sol',-cw/2+34,ch/2-40);ctx.fillText('23/10',cw/2-96,ch/2-40);ctx.restore()}

let G4=null;
function initG4(){G4=[];for(let la=-78;la<=78;la+=4.2){const n=Math.max(8,Math.round(84*Math.cos(la*Math.PI/180)));for(let i=0;i<n;i++)G4.push([la*Math.PI/180,i/n*TAU])}}
const land=(la,lo)=>Math.sin(2*lo+.5)+Math.sin(3*la+lo*1.4)+Math.cos(4*la-2*lo)*.8+Math.sin(5*lo-la)*.5>.55;
function sph(la,lo,rot){const x=Math.cos(la)*Math.sin(lo+rot),y=-Math.sin(la),z=Math.cos(la)*Math.cos(lo+rot),tl=.38;return[x,y*Math.cos(tl)-z*Math.sin(tl),y*Math.sin(tl)+z*Math.cos(tl)]}
const CITY=[['Bogotá',4.7,-74.1],['CDMX',19.4,-99.1],['Madrid',40.4,-3.7]].map(([n,a,b])=>[n,a*Math.PI/180,b*Math.PI/180]);
function s4(ctx,t){darkBg(ctx);if(!G4)initG4();const R=235,cx=444,cy=300,rot=t/DUR*TAU+.9,P=(la,lo,h=1)=>{const[x,y,z]=sph(la,lo,rot);return[cx+x*R*h,cy+y*R*h,z]};
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R+6,0,TAU);ctx.stroke();
  for(const[la,lo]of G4){const[x,y,z]=P(la,lo);if(z<0)continue;const L=land(la,lo);ctx.fillStyle=L?gc((x-cx)/(2*R)+.5,.5+.5*z):`rgba(255,255,255,${.06+.1*z})`;ctx.beginPath();ctx.arc(x,y,L?3.2:1.7,0,TAU);ctx.fill()}
  const pairs=[[0,1,.4],[0,2,1.9],[2,1,3.4]];
  for(const[a,b,st]of pairs){const A=CITY[a],B=CITY[b],pr=eout(seg(t,st,st+1.3)),fade=1-seg(t,st+2.2,st+2.6);if(pr<=0||fade<=0)continue;
    const va=[Math.cos(A[1])*Math.cos(A[2]),Math.sin(A[1]),Math.cos(A[1])*Math.sin(A[2])],vb=[Math.cos(B[1])*Math.cos(B[2]),Math.sin(B[1]),Math.cos(B[1])*Math.sin(B[2])];
    const om=Math.acos(clamp(va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2],-1,1));let prev=null;
    for(let i=0;i<=40*pr;i++){const s=i/40,k1=Math.sin((1-s)*om)/Math.sin(om),k2=Math.sin(s*om)/Math.sin(om),v=[va[0]*k1+vb[0]*k2,va[1]*k1+vb[1]*k2,va[2]*k1+vb[2]*k2];const la=Math.asin(v[1]),lo=Math.atan2(v[2],v[0]);const p=P(la,lo,1+.28*Math.sin(Math.PI*s));
      if(prev&&p[2]>-.1&&prev[2]>-.1){ctx.strokeStyle=gc(s,.95*fade);ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(p[0],p[1]);ctx.stroke()}prev=p}
    if(pr>=1){const p=P(B[1],B[2]),k=seg(t,st+1.3,st+2.1);if(p[2]>0){ctx.strokeStyle=`rgba(255,180,138,${(1-k)*fade})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p[0],p[1],6+k*26,0,TAU);ctx.stroke()}}}

const WORD=['Partículas.','Gráficos.','Física.','Texto.'];
let canv=[];
function collect(){canv=[...document.querySelectorAll('.slide canvas')].filter(c=>c.offsetParent!==null||!document.body.classList.contains('single'))}
function renderAt(t){t=((t%DUR)+DUR)%DUR;for(const c of canv){const ctx=c.getContext('2d');S=c.width/W0;ctx.setTransform(S,0,0,S,0,0);ctx.clearRect(0,0,W0,H0);ctx.save();SC[+c.dataset.scene](ctx,t);ctx.restore();ctx.filter='none';ctx.globalAlpha=1}
  const w=document.getElementById('w1');if(w)w.textContent=WORD[Math.floor(t/1.5)%4];
  const ty=document.getElementById('typed');if(ty){const k=Math.floor(clamp((t-.4)/1.6)*6);ty.textContent='MOTION'.slice(0,k);document.getElementById('caret').style.opacity=(Math.floor(t*2)%2)?0:1}}
window.renderAt=renderAt;
const m=location.search.match(/s=(\d+)/),cap=/cap=1/.test(location.search);
if(m){document.body.classList.add('single');const el=document.querySelector('.slide[data-n="'+m[1]+'"]');if(el)el.classList.add('on')}

if(!cap){window.ready.then(()=>{const t0=performance.now();const loop=()=>{renderAt((performance.now()-t0)/1000);requestAnimationFrame(loop)};loop()})}
